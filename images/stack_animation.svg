<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Стек — анимация: push и pop">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .el { animation-duration: 15s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .e4 { animation-name: e4; }
    .e2 { animation-name: e2; }
    .e7 { animation-name: e7; }
    .e5 { animation-name: e5; }
    .e9 { animation-name: e9; }
    @keyframes e4 { 0% { transform: translateY(-350px); } 6% { transform: translateY(0); } 90% { transform: translateY(0); } 96% { transform: translateY(-350px); } 100% { transform: translateY(-350px); } }
    @keyframes e2 { 0% { transform: translateY(-290px); } 10% { transform: translateY(-290px); } 16% { transform: translateY(0); } 80% { transform: translateY(0); } 86% { transform: translateY(-290px); } 100% { transform: translateY(-290px); } }
    @keyframes e7 { 0% { transform: translateY(-230px); } 20% { transform: translateY(-230px); } 26% { transform: translateY(0); } 30% { transform: translateY(0); } 36% { transform: translateY(-230px); } 100% { transform: translateY(-230px); } }
    @keyframes e5 { 0% { transform: translateY(-230px); } 40% { transform: translateY(-230px); } 46% { transform: translateY(0); } 70% { transform: translateY(0); } 76% { transform: translateY(-230px); } 100% { transform: translateY(-230px); } }
    @keyframes e9 { 0% { transform: translateY(-170px); } 50% { transform: translateY(-170px); } 56% { transform: translateY(0); } 60% { transform: translateY(0); } 66% { transform: translateY(-170px); } 100% { transform: translateY(-170px); } }
    .lbl { opacity: 0; animation-duration: 15s; animation-timing-function: step-end; animation-iteration-count: infinite; }
    .p4 { animation-name: p4; }
    .p2 { animation-name: p2; }
    .p7 { animation-name: p7; }
    .p5 { animation-name: p5; }
    .p9 { animation-name: p9; }
    .pp { animation-name: pp; }
    @keyframes p4 { 0% { opacity: 1; } 10% { opacity: 0; } }
    @keyframes p2 { 0% { opacity: 0; } 10% { opacity: 1; } 20% { opacity: 0; } }
    @keyframes p7 { 0% { opacity: 0; } 20% { opacity: 1; } 30% { opacity: 0; } }
    @keyframes p5 { 0% { opacity: 0; } 40% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes p9 { 0% { opacity: 0; } 50% { opacity: 1; } 60% { opacity: 0; } }
    @keyframes pp { 0% { opacity: 0; } 30% { opacity: 1; } 40% { opacity: 0; } 60% { opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="719" height="419" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <path d="M270 100 V348 H450 V100" fill="none" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>
  <g class="el e4">
    <rect x="280" y="290" width="160" height="56" rx="10" fill="#4C8BF5"/>
    <text x="360" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
  </g>
  <g class="el e2">
    <rect x="280" y="230" width="160" height="56" rx="10" fill="#4C8BF5"/>
    <text x="360" y="266" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
  </g>
  <g class="el e7">
    <rect x="280" y="170" width="160" height="56" rx="10" fill="#4C8BF5"/>
    <text x="360" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">7</text>
  </g>
  <g class="el e5">
    <rect x="280" y="170" width="160" height="56" rx="10" fill="#4C8BF5"/>
    <text x="360" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5</text>
  </g>
  <g class="el e9">
    <rect x="280" y="110" width="160" height="56" rx="10" fill="#4C8BF5"/>
    <text x="360" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">9</text>
  </g>
  <text x="360" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">Стек (Stack)</text>
  <text class="lbl p4" x="360" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push(4)</text>
  <text class="lbl p2" x="360" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push(2)</text>
  <text class="lbl p7" x="360" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push(7)</text>
  <text class="lbl p5" x="360" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push(5)</text>
  <text class="lbl p9" x="360" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push(9)</text>
  <text class="lbl pp" x="360" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#12B886">pop()</text>
</svg>
