<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="Двусвързан списък (Doubly Linked List)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#12B886"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="309" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <text x="360" y="40" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1F2933">Двусвързан списък (Doubly Linked List)</text>
  <text x="360" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6B7280">Всеки възел съдържа prev, data и next — движение в двете посоки.</text>

  <text x="140" y="114" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1F2933">head</text>
  <line x1="140" y1="120" x2="140" y2="144" stroke="#1F2933" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="150" width="160" height="64" rx="10" fill="#E1E5EB"/>
  <rect x="100" y="150" width="80" height="64" fill="#4C8BF5"/>
  <text x="80" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6B7280">prev</text>
  <circle cx="80" cy="190" r="3.5" fill="#1F2933"/>
  <text x="140" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#DCEBFF">data</text>
  <text x="140" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
  <text x="200" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6B7280">next</text>
  <circle cx="200" cy="190" r="3.5" fill="#1F2933"/>
  <rect x="280" y="150" width="160" height="64" rx="10" fill="#E1E5EB"/>
  <rect x="320" y="150" width="80" height="64" fill="#4C8BF5"/>
  <text x="300" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6B7280">prev</text>
  <circle cx="300" cy="190" r="3.5" fill="#1F2933"/>
  <text x="360" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#DCEBFF">data</text>
  <text x="360" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
  <text x="420" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6B7280">next</text>
  <circle cx="420" cy="190" r="3.5" fill="#1F2933"/>
  <rect x="500" y="150" width="160" height="64" rx="10" fill="#E1E5EB"/>
  <rect x="540" y="150" width="80" height="64" fill="#4C8BF5"/>
  <text x="520" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6B7280">prev</text>
  <circle cx="520" cy="190" r="3.5" fill="#1F2933"/>
  <text x="580" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#DCEBFF">data</text>
  <text x="580" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">7</text>
  <text x="640" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6B7280">next</text>
  <circle cx="640" cy="190" r="3.5" fill="#1F2933"/>

  <line x1="220" y1="174" x2="276" y2="174" stroke="#1F2933" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="192" x2="224" y2="192" stroke="#12B886" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="440" y1="174" x2="496" y2="174" stroke="#1F2933" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="192" x2="444" y2="192" stroke="#12B886" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="60" y1="192" x2="26" y2="192" stroke="#12B886" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="56" y="182" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9AA5B1">nullptr</text>
  <line x1="660" y1="174" x2="696" y2="174" stroke="#1F2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="664" y="192" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9AA5B1">nullptr</text>
  <text x="580" y="252" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#12B886">tail</text>
  <line x1="580" y1="246" x2="580" y2="218" stroke="#12B886" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="360" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6B7280">prev сочи назад, next — напред; затова обхождането работи в двете посоки.</text>
</svg>
