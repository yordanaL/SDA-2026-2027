<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Separate chaining — анимация: вмъкване при колизия">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fx { opacity: 0; animation-duration: 16s; animation-timing-function: step-end; animation-iteration-count: infinite; }
    .l1 { animation-name: l1; }
    .l2 { animation-name: l2; }
    .l3 { animation-name: l3; }
    .a1 { animation-name: a1; }
    .a2 { animation-name: a2; }
    .ring { animation-name: ring; }
    .k12 { animation: k12 16s step-end infinite; }
    .k21 { animation: k21 16s step-end infinite; }
    @keyframes l1 {
      0% { opacity: 1; }
      13% { opacity: 1; animation-timing-function: ease-out; }
      15% { opacity: 0; }
      87% { opacity: 0; animation-timing-function: ease-out; }
      89% { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes l2 {
      0% { opacity: 0; }
      16% { opacity: 0; animation-timing-function: ease-out; }
      18% { opacity: 1; }
      27% { opacity: 1; animation-timing-function: ease-out; }
      29% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes l3 {
      0% { opacity: 0; }
      30% { opacity: 0; animation-timing-function: ease-out; }
      32% { opacity: 1; }
      80% { opacity: 1; animation-timing-function: ease-out; }
      83% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes a1 { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 83% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes a2 { 0% { opacity: 0; } 28% { opacity: 1; } 80% { opacity: 1; } 83% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes ring {
      0% { opacity: 0; }
      16% { opacity: 0; animation-timing-function: ease-out; }
      18% { opacity: 1; }
      27% { opacity: 1; animation-timing-function: ease-out; }
      29% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes k12 {
      0% { transform: translate(0,-130px); opacity: 1; }
      4% { transform: translate(0,-130px); opacity: 1; animation-timing-function: ease-in-out; }
      11% { transform: translate(0,0); opacity: 1; animation-timing-function: step-end; }
      80% { transform: translate(0,0); opacity: 1; animation-timing-function: ease-out; }
      83% { transform: translate(0,0); opacity: 0; animation-timing-function: step-end; }
      87% { transform: translate(0,-130px); opacity: 0; animation-timing-function: ease-out; }
      89% { transform: translate(0,-130px); opacity: 1; }
      100% { transform: translate(0,-130px); opacity: 1; }
    }
    @keyframes k21 {
      0% { transform: translate(0,-200px); opacity: 0; }
      18% { transform: translate(0,-200px); opacity: 1; }
      20% { transform: translate(0,-200px); opacity: 1; animation-timing-function: ease-in-out; }
      27% { transform: translate(0,0); opacity: 1; animation-timing-function: step-end; }
      80% { transform: translate(0,0); opacity: 1; animation-timing-function: ease-out; }
      83% { transform: translate(0,0); opacity: 0; animation-timing-function: step-end; }
      87% { transform: translate(0,-200px); opacity: 0; }
      100% { transform: translate(0,-200px); opacity: 0; }
    }
  </style>
  <defs>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="419" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">Separate chaining — вмъкване при колизия</text>
  <text x="360" y="62" text-anchor="middle" font-size="14" fill="#6B7280">Всяка клетка пази списък с добавените двойки</text>

  <!-- кофи 0..3 (индексите са вътре) -->
  <rect x="110" y="126" width="96" height="54" rx="10" fill="#E1E5EB" stroke="#1F2933" stroke-width="2"/>
  <text x="158" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">0</text>
  <rect x="250" y="126" width="96" height="54" rx="10" fill="#E1E5EB" stroke="#1F2933" stroke-width="2"/>
  <text x="298" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">1</text>
  <rect x="390" y="126" width="96" height="54" rx="10" fill="#E1E5EB" stroke="#1F2933" stroke-width="2"/>
  <text x="438" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">2</text>
  <rect x="530" y="126" width="96" height="54" rx="10" fill="#E1E5EB" stroke="#1F2933" stroke-width="2"/>
  <text x="578" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">3</text>

  <!-- статични списъци: кофа 0 → 5, кофа 3 → 7 → 33, кофа 2 → nullptr -->
  <line x1="158" y1="182" x2="158" y2="198" stroke="#1F2933" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="110" y="204" width="96" height="46" rx="10" fill="#4C8BF5"/>
  <text x="158" y="233" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">5</text>
  <text x="438" y="233" text-anchor="middle" font-size="13" fill="#9AA5B1">nullptr</text>
  <line x1="578" y1="182" x2="578" y2="198" stroke="#1F2933" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="530" y="204" width="96" height="46" rx="10" fill="#4C8BF5"/>
  <text x="578" y="233" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">7</text>
  <line x1="578" y1="252" x2="578" y2="268" stroke="#1F2933" stroke-width="2" marker-end="url(#aD)"/>
  <rect x="530" y="274" width="96" height="46" rx="10" fill="#4C8BF5"/>
  <text x="578" y="303" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">33</text>

  <!-- начално състояние на кофа 1: празен списък -->
  <text x="298" y="233" text-anchor="middle" font-size="13" fill="#9AA5B1">nullptr</text>

  <!-- червен пръстен при колизия -->
  <g class="fx ring">
    <rect x="246" y="122" width="104" height="62" rx="12" fill="none" stroke="#F03E3E" stroke-width="3"/>
  </g>

  <!-- анимирани връзки -->
  <g class="fx a1">
    <line x1="298" y1="182" x2="298" y2="198" stroke="#1F2933" stroke-width="2" marker-end="url(#aD)"/>
  </g>
  <g class="fx a2">
    <line x1="298" y1="252" x2="298" y2="268" stroke="#1F2933" stroke-width="2" marker-end="url(#aD)"/>
  </g>

  <!-- летящ ключ 12 (почива над кофа 1, после пада в списъка) -->
  <g class="k12">
    <rect x="250" y="204" width="96" height="46" rx="10" fill="#4C8BF5"/>
    <text x="298" y="233" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">12</text>
  </g>
  <!-- летящ ключ 21 (появява се над кофа 1, после пада под 12) -->
  <g class="k21">
    <rect x="250" y="274" width="96" height="46" rx="10" fill="#4C8BF5"/>
    <text x="298" y="303" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">21</text>
  </g>

  <!-- статус -->
  <rect x="70" y="348" width="580" height="46" rx="10" fill="#FFFFFF" stroke="#E4E7EB"/>
  <text class="fx l1" x="360" y="377" text-anchor="middle" font-size="15" font-weight="700" fill="#4C8BF5">1. insert(12): h(12) = 1 → нов списък в клетка 1</text>
  <text class="fx l2" x="360" y="377" text-anchor="middle" font-size="15" font-weight="700" fill="#F03E3E">2. insert(21): h(21) = 1 — колизия!</text>
  <text class="fx l3" x="360" y="377" text-anchor="middle" font-size="15" font-weight="700" fill="#12B886">3. решение: добавяме в същия списък — търсим само в клетка 1</text>
</svg>
