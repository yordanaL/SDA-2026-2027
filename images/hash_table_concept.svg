<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-label="Хеш таблица — основна идея">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#12B886"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="429" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">Хеш таблица — основна идея</text>
  <text x="360" y="66" text-anchor="middle" font-size="14" fill="#6B7280">Хеш функцията ни казва в коя клетка от масива да пишем стойността</text>

  <text x="140" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2933">ключ (key)</text>
  <rect x="60" y="145" width="160" height="80" rx="12" fill="#4C8BF5"/>
  <text x="140" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">Ivan</text>

  <text x="395" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2933">хеш функция</text>
  <rect x="300" y="145" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <text x="395" y="178" text-anchor="middle" font-size="15" fill="#6B7280">h(x) mod n</text>
  <text x="395" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">h(Ivan) = 3</text>

  <line x1="224" y1="185" x2="292" y2="185" stroke="#1F2933" stroke-width="2" marker-end="url(#aD)"/>
  <line x1="395" y1="233" x2="330" y2="296" stroke="#12B886" stroke-width="2" marker-end="url(#aG)"/>
  <text x="415" y="268" font-size="14" font-weight="700" fill="#12B886">хеш стойност = индекс</text>

  <rect x="112" y="300" width="62" height="62" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <rect x="174" y="300" width="62" height="62" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <rect x="236" y="300" width="62" height="62" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <rect x="298" y="300" width="62" height="62" fill="#12B886" stroke="#1F2933" stroke-width="2"/>
  <rect x="360" y="300" width="62" height="62" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <rect x="422" y="300" width="62" height="62" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <rect x="484" y="300" width="62" height="62" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <rect x="546" y="300" width="62" height="62" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <text x="329" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Ivan</text>

  <text x="143" y="384" text-anchor="middle" font-size="13" fill="#9AA5B1">0</text>
  <text x="205" y="384" text-anchor="middle" font-size="13" fill="#9AA5B1">1</text>
  <text x="267" y="384" text-anchor="middle" font-size="13" fill="#9AA5B1">2</text>
  <text x="329" y="384" text-anchor="middle" font-size="13" fill="#9AA5B1">3</text>
  <text x="391" y="384" text-anchor="middle" font-size="13" fill="#9AA5B1">4</text>
  <text x="453" y="384" text-anchor="middle" font-size="13" fill="#9AA5B1">5</text>
  <text x="515" y="384" text-anchor="middle" font-size="13" fill="#9AA5B1">6</text>
  <text x="577" y="384" text-anchor="middle" font-size="13" fill="#9AA5B1">7</text>
  <text x="360" y="414" text-anchor="middle" font-size="13" fill="#6B7280">масив с n = 8 клетки</text>
</svg>
