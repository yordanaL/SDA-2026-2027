<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-label="Едносвързан списък (Singly Linked List)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="269" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <text x="360" y="40" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1F2933">Едносвързан списък (Singly Linked List)</text>
  <text x="360" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6B7280">Всеки възел съдържа стойност (data) и указател към следващия възел (next).</text>

  <text x="122.5" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1F2933">head</text>
  <line x1="122.5" y1="124" x2="122.5" y2="144" stroke="#1F2933" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="150" width="130" height="64" rx="10" fill="#E1E5EB"/>
  <path d="M 90 150 H 165 V 214 H 90 Q 80 214 80 204 V 160 Q 80 150 90 150 Z" fill="#4C8BF5"/>
  <text x="122.5" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#DCEBFF">data</text>
  <text x="122.5" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
  <text x="187.5" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6B7280">next</text>
  <circle cx="187.5" cy="190" r="4" fill="#1F2933"/>
  <rect x="260" y="150" width="130" height="64" rx="10" fill="#E1E5EB"/>
  <path d="M 270 150 H 345 V 214 H 270 Q 260 214 260 204 V 160 Q 260 150 270 150 Z" fill="#4C8BF5"/>
  <text x="302.5" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#DCEBFF">data</text>
  <text x="302.5" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
  <text x="367.5" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6B7280">next</text>
  <circle cx="367.5" cy="190" r="4" fill="#1F2933"/>
  <rect x="440" y="150" width="130" height="64" rx="10" fill="#E1E5EB"/>
  <path d="M 450 150 H 525 V 214 H 450 Q 440 214 440 204 V 160 Q 440 150 450 150 Z" fill="#4C8BF5"/>
  <text x="482.5" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#DCEBFF">data</text>
  <text x="482.5" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">7</text>
  <text x="547.5" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#6B7280">next</text>
  <circle cx="547.5" cy="190" r="4" fill="#1F2933"/>

  <line x1="210" y1="182" x2="256" y2="182" stroke="#1F2933" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="182" x2="436" y2="182" stroke="#1F2933" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="182" x2="616" y2="182" stroke="#1F2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="624" y="187" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9AA5B1">nullptr</text>
  <text x="360" y="246" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6B7280">Обхождането започва от head и следва next, докато не се стигне до nullptr.</text>
</svg>
