<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-label="BFS обхождане в широчина (level order) — анимация">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .x { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .s { opacity: 0; font-size: 20px; font-weight: 700; fill: #1F2933; }
    .ring { opacity: 0; fill: none; stroke: #F59F00; stroke-width: 4; }
    .tok { opacity: 0; font-size: 22px; font-weight: 700; fill: #1F2933; }
    .lab { opacity: 0; font-size: 16px; font-weight: 700; }
    .sA0 { animation-name: sA0; }
    @keyframes sA0 { 0% { opacity: 0; } 0% { opacity: 0; } 1% { opacity: 1; } 12% { opacity: 1; } 14% { opacity: 0; } 100% { opacity: 0; } }
    .sA1 { animation-name: sA1; }
    @keyframes sA1 { 0% { opacity: 0; } 12% { opacity: 0; } 14% { opacity: 1; } 26% { opacity: 1; } 28% { opacity: 0; } 100% { opacity: 0; } }
    .sA2 { animation-name: sA2; }
    @keyframes sA2 { 0% { opacity: 0; } 26% { opacity: 0; } 28% { opacity: 1; } 40% { opacity: 1; } 42% { opacity: 0; } 100% { opacity: 0; } }
    .sA3 { animation-name: sA3; }
    @keyframes sA3 { 0% { opacity: 0; } 40% { opacity: 0; } 42% { opacity: 1; } 54% { opacity: 1; } 56% { opacity: 0; } 100% { opacity: 0; } }
    .sA4 { animation-name: sA4; }
    @keyframes sA4 { 0% { opacity: 0; } 54% { opacity: 0; } 56% { opacity: 1; } 68% { opacity: 1; } 70% { opacity: 0; } 100% { opacity: 0; } }
    .sA5 { animation-name: sA5; }
    @keyframes sA5 { 0% { opacity: 0; } 68% { opacity: 0; } 70% { opacity: 1; } 82% { opacity: 1; } 84% { opacity: 0; } 100% { opacity: 0; } }
    .rg8 { animation-name: rg8; }
    @keyframes rg8 { 0% { opacity: 0; } 4% { opacity: 0; } 4.5% { opacity: 1; } 12.5% { opacity: 1; } 13% { opacity: 0; } 100% { opacity: 0; } }
    .rg3 { animation-name: rg3; }
    @keyframes rg3 { 0% { opacity: 0; } 18% { opacity: 0; } 18.5% { opacity: 1; } 26.5% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
    .rg10 { animation-name: rg10; }
    @keyframes rg10 { 0% { opacity: 0; } 32% { opacity: 0; } 32.5% { opacity: 1; } 40.5% { opacity: 1; } 41% { opacity: 0; } 100% { opacity: 0; } }
    .rg1 { animation-name: rg1; }
    @keyframes rg1 { 0% { opacity: 0; } 46% { opacity: 0; } 46.5% { opacity: 1; } 54.5% { opacity: 1; } 55% { opacity: 0; } 100% { opacity: 0; } }
    .rg6 { animation-name: rg6; }
    @keyframes rg6 { 0% { opacity: 0; } 60% { opacity: 0; } 60.5% { opacity: 1; } 68.5% { opacity: 1; } 69% { opacity: 0; } 100% { opacity: 0; } }
    .rg14 { animation-name: rg14; }
    @keyframes rg14 { 0% { opacity: 0; } 74% { opacity: 0; } 74.5% { opacity: 1; } 82.5% { opacity: 1; } 83% { opacity: 0; } 100% { opacity: 0; } }
    .tk8 { animation-name: tk8; }
    @keyframes tk8 { 0% { opacity: 0; } 7% { opacity: 0; } 7.7% { opacity: 1; } 96% { opacity: 1; } 98% { opacity: 0; } 100% { opacity: 0; } }
    .tk3 { animation-name: tk3; }
    @keyframes tk3 { 0% { opacity: 0; } 21% { opacity: 0; } 21.7% { opacity: 1; } 96% { opacity: 1; } 98% { opacity: 0; } 100% { opacity: 0; } }
    .tk10 { animation-name: tk10; }
    @keyframes tk10 { 0% { opacity: 0; } 35% { opacity: 0; } 35.7% { opacity: 1; } 96% { opacity: 1; } 98% { opacity: 0; } 100% { opacity: 0; } }
    .tk1 { animation-name: tk1; }
    @keyframes tk1 { 0% { opacity: 0; } 49% { opacity: 0; } 49.7% { opacity: 1; } 96% { opacity: 1; } 98% { opacity: 0; } 100% { opacity: 0; } }
    .tk6 { animation-name: tk6; }
    @keyframes tk6 { 0% { opacity: 0; } 63% { opacity: 0; } 63.7% { opacity: 1; } 96% { opacity: 1; } 98% { opacity: 0; } 100% { opacity: 0; } }
    .tk14 { animation-name: tk14; }
    @keyframes tk14 { 0% { opacity: 0; } 77% { opacity: 0; } 77.7% { opacity: 1; } 96% { opacity: 1; } 98% { opacity: 0; } 100% { opacity: 0; } }
    .lb0 { animation-name: lb0; }
    @keyframes lb0 { 0% { opacity: 1; } 3.5% { opacity: 0; } 100% { opacity: 0; } }
    .lb1 { animation-name: lb1; }
    @keyframes lb1 { 0% { opacity: 0; } 4% { opacity: 0; } 5% { opacity: 1; } 12% { opacity: 1; } 13% { opacity: 0; } 100% { opacity: 0; } }
    .lb2 { animation-name: lb2; }
    @keyframes lb2 { 0% { opacity: 0; } 18% { opacity: 0; } 19% { opacity: 1; } 26% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
    .lb3 { animation-name: lb3; }
    @keyframes lb3 { 0% { opacity: 0; } 32% { opacity: 0; } 33% { opacity: 1; } 40% { opacity: 1; } 41% { opacity: 0; } 100% { opacity: 0; } }
    .lb4 { animation-name: lb4; }
    @keyframes lb4 { 0% { opacity: 0; } 46% { opacity: 0; } 47% { opacity: 1; } 54% { opacity: 1; } 55% { opacity: 0; } 100% { opacity: 0; } }
    .lb5 { animation-name: lb5; }
    @keyframes lb5 { 0% { opacity: 0; } 60% { opacity: 0; } 61% { opacity: 1; } 68% { opacity: 1; } 69% { opacity: 0; } 100% { opacity: 0; } }
    .lb6 { animation-name: lb6; }
    @keyframes lb6 { 0% { opacity: 0; } 74% { opacity: 0; } 75% { opacity: 1; } 95% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="719" height="559" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">BFS / Level Order обхождане (опашка)</text>
  <g stroke="#1F2933" stroke-width="2">
    <line x1="360" y1="85" x2="255" y2="175"/>
    <line x1="360" y1="85" x2="465" y2="175"/>
    <line x1="255" y1="175" x2="195" y2="265"/>
    <line x1="255" y1="175" x2="315" y2="265"/>
    <line x1="465" y1="175" x2="535" y2="265"/>
  </g>
  <g>
    <circle cx="535" cy="265" r="22" fill="#4C8BF5"/>
    <text x="535" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">14</text>
    <circle cx="465" cy="175" r="22" fill="#4C8BF5"/>
    <text x="465" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">10</text>
    <circle cx="360" cy="85" r="22" fill="#4C8BF5"/>
    <text x="360" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">8</text>
    <circle cx="315" cy="265" r="22" fill="#4C8BF5"/>
    <text x="315" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">6</text>
    <circle cx="255" cy="175" r="22" fill="#4C8BF5"/>
    <text x="255" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <circle cx="195" cy="265" r="22" fill="#4C8BF5"/>
    <text x="195" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
  </g>
  <circle class="x ring rg8" cx="360" cy="85" r="28"/>
  <circle class="x ring rg3" cx="255" cy="175" r="28"/>
  <circle class="x ring rg10" cx="465" cy="175" r="28"/>
  <circle class="x ring rg1" cx="195" cy="265" r="28"/>
  <circle class="x ring rg6" cx="315" cy="265" r="28"/>
  <circle class="x ring rg14" cx="535" cy="265" r="28"/>
  <text x="140" y="357" text-anchor="end" font-size="14" font-weight="700" fill="#1F2933">опашка:</text>
  <rect x="150" y="330" width="56" height="42" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2"/>
  <rect x="212" y="330" width="56" height="42" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2"/>
  <rect x="274" y="330" width="56" height="42" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2"/>
  <text x="178" y="392" text-anchor="middle" font-size="11" fill="#9AA5B1">front</text>
  <text class="x s sA0" x="178" y="359" text-anchor="middle">8</text>
  <text class="x s sA1" x="178" y="359" text-anchor="middle">3</text>
  <text class="x s sA1" x="240" y="359" text-anchor="middle">10</text>
  <text class="x s sA2" x="178" y="359" text-anchor="middle">10</text>
  <text class="x s sA2" x="240" y="359" text-anchor="middle">1</text>
  <text class="x s sA2" x="302" y="359" text-anchor="middle">6</text>
  <text class="x s sA3" x="178" y="359" text-anchor="middle">1</text>
  <text class="x s sA3" x="240" y="359" text-anchor="middle">6</text>
  <text class="x s sA3" x="302" y="359" text-anchor="middle">14</text>
  <text class="x s sA4" x="178" y="359" text-anchor="middle">6</text>
  <text class="x s sA4" x="240" y="359" text-anchor="middle">14</text>
  <text class="x s sA5" x="178" y="359" text-anchor="middle">14</text>
  <text x="160" y="452" text-anchor="end" font-size="14" font-weight="700" fill="#1F2933">изход:</text>
  <text class="x tok tk8" x="185" y="452" text-anchor="middle">8</text>
  <text class="x tok tk3" x="255" y="452" text-anchor="middle">3</text>
  <text class="x tok tk10" x="325" y="452" text-anchor="middle">10</text>
  <text class="x tok tk1" x="395" y="452" text-anchor="middle">1</text>
  <text class="x tok tk6" x="465" y="452" text-anchor="middle">6</text>
  <text class="x tok tk14" x="535" y="452" text-anchor="middle">14</text>
  <text class="x lab lb0" x="360" y="500" text-anchor="middle" fill="#4C8BF5">започваме от корена</text>
  <text class="x lab lb1" x="360" y="500" text-anchor="middle" fill="#F03E3E">pop() → 8;  push(3), push(10)</text>
  <text class="x lab lb2" x="360" y="500" text-anchor="middle" fill="#F03E3E">pop() → 3;  push(1), push(6)</text>
  <text class="x lab lb3" x="360" y="500" text-anchor="middle" fill="#F03E3E">pop() → 10;  push(14)</text>
  <text class="x lab lb4" x="360" y="500" text-anchor="middle" fill="#F03E3E">pop() → 1</text>
  <text class="x lab lb5" x="360" y="500" text-anchor="middle" fill="#F03E3E">pop() → 6</text>
  <text class="x lab lb6" x="360" y="500" text-anchor="middle" fill="#12B886">pop() → 14; опашката е празна — готово!</text>
  <text x="360" y="535" text-anchor="middle" font-size="12" fill="#6B7280">Level order обхожда възлите ниво по ниво, като пази децата за следващото ниво в опашка.</text>
</svg>
