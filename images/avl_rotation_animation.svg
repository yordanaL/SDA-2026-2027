<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-label="AVL лява ротация (RR случай) — анимация">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .a { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: step-end; }
    .lab { opacity: 0; font-size: 16px; font-weight: 700; }
    .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; }
    @keyframes l1 { 0% { opacity: 0; } 3% { opacity: 1; } 26% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l2 { 0% { opacity: 0; } 27% { opacity: 1; } 61% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l3 { 0% { opacity: 0; } 64% { opacity: 1; } 92% { opacity: 0; } 100% { opacity: 0; } }
    .eb, .ea { opacity: 0; animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .eb { animation-name: eb; } .ea { animation-name: ea; }
    @keyframes eb { 0% { opacity: 0; } 3% { opacity: 1; } 25% { opacity: 1; } 31% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes ea { 0% { opacity: 0; } 56% { opacity: 0; } 61% { opacity: 1; } 92% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
    .n { opacity: 0; animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .n31 { animation-name: n31; } .n99 { animation-name: n99; } .n133 { animation-name: n133; }
    @keyframes n31 { 0% { opacity: 0; transform: none; } 3% { opacity: 1; transform: none; } 32% { opacity: 1; transform: none; } 56% { opacity: 1; transform: translate(-45px, 120px); } 92% { opacity: 1; transform: translate(-45px, 120px); } 97% { opacity: 0; transform: translate(-45px, 120px); } 100% { opacity: 0; transform: translate(-45px, 120px); } }
    @keyframes n99 { 0% { opacity: 0; transform: none; } 3% { opacity: 1; transform: none; } 32% { opacity: 1; transform: none; } 56% { opacity: 1; transform: translate(-50px, -120px); } 92% { opacity: 1; transform: translate(-50px, -120px); } 97% { opacity: 0; transform: translate(-50px, -120px); } 100% { opacity: 0; transform: translate(-50px, -120px); } }
    @keyframes n133 { 0% { opacity: 0; transform: none; } 3% { opacity: 1; transform: none; } 32% { opacity: 1; transform: none; } 56% { opacity: 1; transform: translate(-55px, -120px); } 92% { opacity: 1; transform: translate(-55px, -120px); } 97% { opacity: 0; transform: translate(-55px, -120px); } 100% { opacity: 0; transform: translate(-55px, -120px); } }
    .bd { opacity: 0; font-size: 13px; font-weight: 700; }
    .b1 { animation-name: b1; } .b2 { animation-name: b2; }
    .b1, .b2 { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: step-end; }
    @keyframes b1 { 0% { opacity: 0; } 3% { opacity: 1; } 24% { opacity: 1; } 26% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes b2 { 0% { opacity: 0; } 64% { opacity: 1; } 92% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="719" height="459" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">AVL дърво — лява ротация (RR случай)</text>

  <!-- ръбове преди ротацията -->
  <g stroke="#1F2933" stroke-width="2">
    <line class="eb" x1="300" y1="95" x2="420" y2="215"/>
    <line class="eb" x1="420" y1="215" x2="540" y2="335"/>
  </g>
  <!-- ръбове след ротацията -->
  <g stroke="#1F2933" stroke-width="2">
    <line class="ea" x1="370" y1="95" x2="255" y2="215"/>
    <line class="ea" x1="370" y1="95" x2="485" y2="215"/>
  </g>

  <!-- възли (нормална позиция = преди ротация) -->
  <g class="n n31">
    <circle cx="300" cy="95" r="22" fill="#4C8BF5"/>
    <text x="300" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">31</text>
  </g>
  <g class="n n99">
    <circle cx="420" cy="215" r="22" fill="#4C8BF5"/>
    <text x="420" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">99</text>
  </g>
  <g class="n n133">
    <circle cx="540" cy="335" r="22" fill="#4C8BF5"/>
    <text x="540" y="342" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">133</text>
  </g>

  <!-- баланс фактор -->
  <text class="bd b1" x="334" y="85" fill="#F03E3E">BF = 2</text>
  <text class="bd b1" x="454" y="205" fill="#F59F00">BF = 1</text>
  <text class="bd b2" x="404" y="85" fill="#12B886">BF = 0</text>
  <text class="bd b2" x="285" y="205" fill="#12B886">BF = 0</text>

  <text class="a lab l1" x="360" y="412" text-anchor="middle" fill="#F03E3E">дисбаланс: BF(31) = 2 → нужна е ротация</text>
  <text class="a lab l2" x="360" y="412" text-anchor="middle" fill="#4C8BF5">правим лява ротация около 31</text>
  <text class="a lab l3" x="360" y="412" text-anchor="middle" fill="#12B886">балансирано: |BF| ≤ 1</text>
  <text x="360" y="444" text-anchor="middle" font-size="12" fill="#6B7280">Поддърветата се местят заедно с възлите: лявото дете на 99 става дясно дете на 31.</text>
</svg>
