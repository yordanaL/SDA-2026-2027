<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-label="Търсене в двоично дърво за търсене — анимация">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .a { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: step-end; }
    .lab { opacity: 0; font-size: 16px; font-weight: 700; }
    .l0 { animation-name: l0; } .l1 { animation-name: l1; }
    .l2 { animation-name: l2; } .l3 { animation-name: l3; }
    @keyframes l0 { 0% { opacity: 1; } 5% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l1 { 0% { opacity: 0; } 6% { opacity: 1; } 15% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l2 { 0% { opacity: 0; } 18% { opacity: 1; } 33% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l3 { 0% { opacity: 0; } 36% { opacity: 1; } 56% { opacity: 0; } 100% { opacity: 0; } }
    .eh { opacity: 0; }
    .e83 { animation-name: e83; } .e36 { animation-name: e36; }
    @keyframes e83 { 0% { opacity: 0; } 6% { opacity: 1; } 15% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes e36 { 0% { opacity: 0; } 18% { opacity: 1; } 33% { opacity: 0; } 100% { opacity: 0; } }
    .ring { opacity: 0; fill: none; stroke-width: 4; }
    .r8 { animation-name: r8; } .r3 { animation-name: r3; } .r6 { animation-name: r6; }
    @keyframes r8 { 0% { opacity: 0; } 6% { opacity: 1; } 15% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes r3 { 0% { opacity: 0; } 18% { opacity: 1; } 33% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes r6 { 0% { opacity: 0; } 36% { opacity: 1; } 56% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="719" height="449" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">Търсене (search) в BST — търси се 6</text>

  <g stroke="#1F2933" stroke-width="2">
    <line x1="360" y1="95" x2="250" y2="195"/>
    <line x1="360" y1="95" x2="470" y2="195"/>
    <line x1="250" y1="195" x2="190" y2="295"/>
    <line x1="250" y1="195" x2="310" y2="295"/>
    <line x1="470" y1="195" x2="545" y2="295"/>
  </g>
  <g stroke="#F59F00" stroke-width="3">
    <line class="eh e83" x1="360" y1="95" x2="250" y2="195"/>
    <line class="eh e36" x1="250" y1="195" x2="310" y2="295"/>
  </g>

  <g>
    <circle cx="360" cy="95" r="22" fill="#4C8BF5"/>
    <text x="360" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">8</text>
    <circle cx="250" cy="195" r="22" fill="#4C8BF5"/>
    <text x="250" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <circle cx="470" cy="195" r="22" fill="#4C8BF5"/>
    <text x="470" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">10</text>
    <circle cx="190" cy="295" r="22" fill="#4C8BF5"/>
    <text x="190" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <circle cx="310" cy="295" r="22" fill="#4C8BF5"/>
    <text x="310" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">6</text>
    <circle cx="545" cy="295" r="22" fill="#4C8BF5"/>
    <text x="545" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">14</text>
  </g>

  <circle class="a ring r8" cx="360" cy="95" r="28" stroke="#F03E3E"/>
  <circle class="a ring r3" cx="250" cy="195" r="28" stroke="#F03E3E"/>
  <circle class="a ring r6" cx="310" cy="295" r="28" stroke="#12B886"/>

  <text class="a lab l0" x="360" y="392" text-anchor="middle" fill="#4C8BF5">търси се 6</text>
  <text class="a lab l1" x="360" y="392" text-anchor="middle" fill="#F03E3E">6 &lt; 8 → тръгваме наляво</text>
  <text class="a lab l2" x="360" y="392" text-anchor="middle" fill="#F03E3E">6 &gt; 3 → тръгваме надясно</text>
  <text class="a lab l3" x="360" y="392" text-anchor="middle" fill="#12B886">6 == 6 → намерено!</text>
  <text x="360" y="428" text-anchor="middle" font-size="12" fill="#6B7280">Сравняваме с текущия възел и слизаме в съответното поддърво — докато не стигнем nullptr или намерим стойността.</text>
</svg>
