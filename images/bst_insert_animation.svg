<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="Добавяне на елемент в двоично дърво за търсене — анимация">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .a { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: step-end; }
    .lab { opacity: 0; font-size: 16px; font-weight: 700; }
    .l0 { animation-name: l0; } .l1 { animation-name: l1; } .l2 { animation-name: l2; }
    .l3 { animation-name: l3; } .l4 { animation-name: l4; } .l5 { animation-name: l5; }
    @keyframes l0 { 0% { opacity: 1; } 6% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l1 { 0% { opacity: 0; } 6% { opacity: 1; } 16% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l2 { 0% { opacity: 0; } 18% { opacity: 1; } 32% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l3 { 0% { opacity: 0; } 34% { opacity: 1; } 48% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l4 { 0% { opacity: 0; } 50% { opacity: 1; } 63% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes l5 { 0% { opacity: 0; } 68% { opacity: 1; } 88% { opacity: 0; } 100% { opacity: 0; } }
    .ring { opacity: 0; fill: none; stroke: #F03E3E; stroke-width: 4; }
    .r8 { animation-name: r8; } .r3 { animation-name: r3; }
    .r6 { animation-name: r6; } .rs { animation-name: rs; stroke: #F59F00; }
    @keyframes r8 { 0% { opacity: 0; } 6% { opacity: 1; } 16% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes r3 { 0% { opacity: 0; } 18% { opacity: 1; } 32% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes r6 { 0% { opacity: 0; } 34% { opacity: 1; } 48% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes rs { 0% { opacity: 0; } 50% { opacity: 1; } 63% { opacity: 0; } 100% { opacity: 0; } }
    .slot { animation: slot 16s ease-in-out infinite; }
    .newg { opacity: 0; animation: newg 16s ease-in-out infinite; }
    @keyframes slot { 0% { opacity: 1; } 63% { opacity: 1; } 65% { opacity: 0; } 96% { opacity: 0; } 97% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes newg { 0% { opacity: 0; } 65% { opacity: 0; } 68% { opacity: 1; } 93% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="719" height="479" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">Добавяне (insert) в BST — insert(5)</text>

  <g stroke="#1F2933" stroke-width="2">
    <line x1="360" y1="85" x2="250" y2="180"/>
    <line x1="360" y1="85" x2="470" y2="180"/>
    <line x1="250" y1="180" x2="190" y2="275"/>
    <line x1="250" y1="180" x2="310" y2="275"/>
  </g>

  <g>
    <circle cx="360" cy="85" r="22" fill="#4C8BF5"/>
    <text x="360" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">8</text>
    <circle cx="250" cy="180" r="22" fill="#4C8BF5"/>
    <text x="250" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <circle cx="470" cy="180" r="22" fill="#4C8BF5"/>
    <text x="470" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">10</text>
    <circle cx="190" cy="275" r="22" fill="#4C8BF5"/>
    <text x="190" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <circle cx="310" cy="275" r="22" fill="#4C8BF5"/>
    <text x="310" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">6</text>
  </g>

  <!-- празно място (nullptr) -->
  <g class="slot">
    <line x1="310" y1="275" x2="245" y2="370" stroke="#9AA5B1" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="245" cy="370" r="22" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="245" y="406" text-anchor="middle" font-size="11" fill="#9AA5B1">nullptr</text>
  </g>

  <!-- нов възел -->
  <g class="newg">
    <line x1="310" y1="275" x2="245" y2="370" stroke="#1F2933" stroke-width="2"/>
    <circle cx="245" cy="370" r="22" fill="#12B886"/>
    <text x="245" y="377" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">5</text>
  </g>

  <circle class="a ring r8" cx="360" cy="85" r="28"/>
  <circle class="a ring r3" cx="250" cy="180" r="28"/>
  <circle class="a ring r6" cx="310" cy="275" r="28"/>
  <circle class="a ring rs" cx="245" cy="370" r="28"/>

  <text class="a lab l0" x="360" y="438" text-anchor="middle" fill="#4C8BF5">insert(5)</text>
  <text class="a lab l1" x="360" y="438" text-anchor="middle" fill="#F03E3E">5 &lt; 8 → наляво</text>
  <text class="a lab l2" x="360" y="438" text-anchor="middle" fill="#F03E3E">5 &gt; 3 → надясно</text>
  <text class="a lab l3" x="360" y="438" text-anchor="middle" fill="#F03E3E">5 &lt; 6 → наляво</text>
  <text class="a lab l4" x="360" y="438" text-anchor="middle" fill="#F59F00">nullptr → празно място, добавяме тук</text>
  <text class="a lab l5" x="360" y="438" text-anchor="middle" fill="#12B886">готово! новият листо е 5</text>
  <text x="360" y="466" text-anchor="middle" font-size="12" fill="#6B7280">Следваме сравняванията, докато не стигнем nullptr — там закачаме новия възел.</text>
</svg>
