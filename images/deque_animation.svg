<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Дек — анимация: push_front/push_back и pop_front/pop_back">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .el { animation-duration: 15s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .e4 { animation-name: e4; }
    .e2 { animation-name: e2; }
    .e7 { animation-name: e7; }
    .e5 { animation-name: e5; }
    .e9 { animation-name: e9; }
    @keyframes e4 { 0% { transform: translateX(680px); } 6% { transform: translateX(0); } 10% { transform: translateX(0); } 16% { transform: translateX(160px); } 30% { transform: translateX(160px); } 36% { transform: translateX(0); } 40% { transform: translateX(0); } 46% { transform: translateX(160px); } 70% { transform: translateX(160px); } 76% { transform: translateX(0); } 90% { transform: translateX(0); } 96% { transform: translateX(-190px); } 100% { transform: translateX(-190px); } }
    @keyframes e2 { 0% { transform: translateX(-190px); } 10% { transform: translateX(-190px); } 16% { transform: translateX(0); } 30% { transform: translateX(0); } 36% { transform: translateX(-190px); } 100% { transform: translateX(-190px); } }
    @keyframes e7 { 0% { transform: translateX(360px); } 20% { transform: translateX(360px); } 26% { transform: translateX(0); } 30% { transform: translateX(0); } 36% { transform: translateX(-160px); } 40% { transform: translateX(-160px); } 46% { transform: translateX(0); } 50% { transform: translateX(0); } 56% { transform: translateX(360px); } 100% { transform: translateX(360px); } }
    @keyframes e5 { 0% { transform: translateX(-190px); } 40% { transform: translateX(-190px); } 46% { transform: translateX(0); } 70% { transform: translateX(0); } 76% { transform: translateX(-190px); } 100% { transform: translateX(-190px); } }
    @keyframes e9 { 0% { transform: translateX(360px); } 60% { transform: translateX(360px); } 66% { transform: translateX(0); } 70% { transform: translateX(0); } 76% { transform: translateX(-160px); } 80% { transform: translateX(-160px); } 86% { transform: translateX(360px); } 100% { transform: translateX(360px); } }
    .lbl { opacity: 0; animation-duration: 15s; animation-timing-function: step-end; animation-iteration-count: infinite; }
    .l1 { animation-name: l1; }
    .l2 { animation-name: l2; }
    .l3 { animation-name: l3; }
    .l4 { animation-name: l4; }
    .l5 { animation-name: l5; }
    .l6 { animation-name: l6; }
    .l7 { animation-name: l7; }
    .l8 { animation-name: l8; }
    .l9 { animation-name: l9; }
    .l10 { animation-name: l10; }
    @keyframes l1 { 0% { opacity: 1; } 10% { opacity: 0; } }
    @keyframes l2 { 0% { opacity: 0; } 10% { opacity: 1; } 20% { opacity: 0; } }
    @keyframes l3 { 0% { opacity: 0; } 20% { opacity: 1; } 30% { opacity: 0; } }
    @keyframes l4 { 0% { opacity: 0; } 30% { opacity: 1; } 40% { opacity: 0; } }
    @keyframes l5 { 0% { opacity: 0; } 40% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes l6 { 0% { opacity: 0; } 50% { opacity: 1; } 60% { opacity: 0; } }
    @keyframes l7 { 0% { opacity: 0; } 60% { opacity: 1; } 70% { opacity: 0; } }
    @keyframes l8 { 0% { opacity: 0; } 70% { opacity: 1; } 80% { opacity: 0; } }
    @keyframes l9 { 0% { opacity: 0; } 80% { opacity: 1; } 90% { opacity: 0; } }
    @keyframes l10 { 0% { opacity: 0; } 90% { opacity: 1; } 100% { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="719" height="299" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>
  <text x="360" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">Дек (Deque)</text>
  <line x1="24" y1="114" x2="696" y2="114" stroke="#1F2933" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="210" x2="696" y2="210" stroke="#1F2933" stroke-width="2" stroke-linecap="round"/>
  <g class="el e4">
    <rect x="40" y="130" width="140" height="64" rx="10" fill="#4C8BF5"/>
    <text x="110" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
  </g>
  <g class="el e2">
    <rect x="40" y="130" width="140" height="64" rx="10" fill="#4C8BF5"/>
    <text x="110" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
  </g>
  <g class="el e7">
    <rect x="360" y="130" width="140" height="64" rx="10" fill="#4C8BF5"/>
    <text x="430" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">7</text>
  </g>
  <g class="el e5">
    <rect x="40" y="130" width="140" height="64" rx="10" fill="#4C8BF5"/>
    <text x="110" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5</text>
  </g>
  <g class="el e9">
    <rect x="360" y="130" width="140" height="64" rx="10" fill="#4C8BF5"/>
    <text x="430" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">9</text>
  </g>
  <text class="lbl l1" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push_back(4)</text>
  <text class="lbl l2" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push_front(2)</text>
  <text class="lbl l3" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push_back(7)</text>
  <text class="lbl l4" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#12B886">pop_front()</text>
  <text class="lbl l5" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push_front(5)</text>
  <text class="lbl l6" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#12B886">pop_back()</text>
  <text class="lbl l7" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#4C8BF5">push_back(9)</text>
  <text class="lbl l8" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#12B886">pop_front()</text>
  <text class="lbl l9" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#12B886">pop_back()</text>
  <text class="lbl l10" x="360" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#12B886">pop_front()</text>
</svg>
