<svg xmlns="http://www.w3.org/2000/svg" width="612" height="612" viewBox="0 0 612 612" role="img" aria-label="Купички, вложени една в друга — последната сложена се вади пръва, пример от бита за стек (LIFO)">
  <defs>
    <linearGradient id="bowlBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E9BFF"/><stop offset="1" stop-color="#3B6FD4"/></linearGradient>
    <linearGradient id="bowlWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DFE5EB"/></linearGradient>
    <linearGradient id="bowlOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC24D"/><stop offset="1" stop-color="#ED9417"/></linearGradient>
    <linearGradient id="bowlGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FD19B"/><stop offset="1" stop-color="#0CA678"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="611" height="611" rx="14" fill="#F8F9FA" stroke="#E4E7EB"/>

  <!-- под (общ стил): y=512 -->
  <line x1="40" y1="512" x2="572" y2="512" stroke="#D8DCE1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="306" cy="508" rx="182" ry="12" fill="#E4E7EB"/>

  <!-- сцена -->
  <g transform="translate(0 -14)">
    <!-- купичка 1 (най-долу, най-голяма) -->
    <path d="M134 462 C134 504 180 520 306 520 C432 520 478 504 478 462 Z" fill="url(#bowlBlue)"/>
    <path d="M134 462 C134 504 180 520 306 520 C432 520 478 504 478 462" fill="none" stroke="#3B6FD4" stroke-width="4"/>
    <ellipse cx="306" cy="462" rx="172" ry="19" fill="#A8C7FA" stroke="#3B6FD4" stroke-width="4"/>
    <ellipse cx="306" cy="464" rx="152" ry="14" fill="#2E5BB8"/>

    <!-- купичка 2 -->
    <path d="M154 420 C154 456 196 470 306 470 C416 470 458 456 458 420 Z" fill="url(#bowlWhite)"/>
    <path d="M154 420 C154 456 196 470 306 470 C416 470 458 456 458 420" fill="none" stroke="#C9D2DB" stroke-width="4"/>
    <ellipse cx="306" cy="420" rx="152" ry="17" fill="#EEF1F4" stroke="#C9D2DB" stroke-width="4"/>
    <ellipse cx="306" cy="422" rx="133" ry="12" fill="#B6C1CC"/>

    <!-- купичка 3 -->
    <path d="M174 382 C174 414 212 428 306 428 C400 428 438 414 438 382 Z" fill="url(#bowlOrange)"/>
    <path d="M174 382 C174 414 212 428 306 428 C400 428 438 414 438 382" fill="none" stroke="#DE9308" stroke-width="4"/>
    <ellipse cx="306" cy="382" rx="132" ry="15" fill="#FBCB5B" stroke="#DE9308" stroke-width="4"/>
    <ellipse cx="306" cy="384" rx="114" ry="11" fill="#C97F0F"/>

    <!-- купичка 4 -->
    <path d="M194 348 C194 376 228 390 306 390 C384 390 418 376 418 348 Z" fill="url(#bowlWhite)"/>
    <path d="M194 348 C194 376 228 390 306 390 C384 390 418 376 418 348" fill="none" stroke="#C9D2DB" stroke-width="4"/>
    <ellipse cx="306" cy="348" rx="112" ry="13" fill="#EEF1F4" stroke="#C9D2DB" stroke-width="4"/>
    <ellipse cx="306" cy="350" rx="95" ry="9" fill="#B6C1CC"/>

    <!-- купичка 5 (върхът на стека) — тя се вади пръва -->
    <path d="M214 318 C214 342 244 354 306 354 C368 354 398 342 398 318 Z" fill="url(#bowlGreen)"/>
    <path d="M214 318 C214 342 244 354 306 354 C368 354 398 342 398 318" fill="none" stroke="#0CA678" stroke-width="4"/>
    <ellipse cx="306" cy="318" rx="92" ry="12" fill="#63D6AE" stroke="#0CA678" stroke-width="4"/>
    <ellipse cx="306" cy="320" rx="76" ry="8" fill="#0B8F66"/>
    <path d="M168 490 C176 506 208 514 250 516" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.3"/>

    <!-- стрелка: вадиш от върха -->
    <path d="M520 296 V240" stroke="#12B886" stroke-width="7" stroke-linecap="round"/>
    <polygon points="520,214 506,240 534,240" fill="#12B886"/>
    <text x="596" y="206" text-anchor="end" font-size="17" font-weight="600" fill="#12B886" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">вадиш отгоре</text>
  </g>

  <text x="306" y="570" text-anchor="middle" font-size="19" font-weight="600" fill="#6B7280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">купички — вложени една в друга</text>
</svg>
